services:
  - type: web
    name: musheer-academic-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && mkdir -p media/portraits media/cv && cp -n ../frontend/public/portraits/dr_musheer_ahmad.png media/portraits/dr_musheer_ahmad.png && cp -n ../frontend/public/mahmad9.pdf media/cv/mahmad9.pdf && python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /healthz
    initialDeployHook: cd backend && python manage.py bootstrap_render_admin && python manage.py seed_academic_structure && python manage.py import_cv_publications
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: musheer-academic-db
          property: connectionString
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: musheer-academic-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: musheer-academic-db
    plan: free
    region: singapore
    databaseName: musheer_portfolio
    user: musheer_portfolio
    postgresMajorVersion: "16"
